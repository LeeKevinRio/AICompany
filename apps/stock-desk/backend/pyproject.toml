[project]
name = "stock-desk-backend"
version = "0.1.0"
description = "Stock Desk backend service (Phase 1 skeleton)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "pandas>=3.0.5",
    "numpy>=2.5.1",
    "pyyaml>=6.0.3",
    "apscheduler>=3.11.3,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.15",
    "respx>=0.22",
    "pandas-stubs>=3.0.3.260530",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

# APScheduler 3.x ships no py.typed marker and has no maintained stub package,
# so its imports are untyped by necessity. The scheduler wraps every job in a
# locally typed callable, so nothing untyped leaks past app/scheduler.py.
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
